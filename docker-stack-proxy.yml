# ECE1779 Collaborative Task Management Platform
# NGINX reverse proxy for Docker Swarm

services:
  nginx:
    image: nginx:1.30.7-alpine

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress

      - target: 443
        published: 443
        protocol: tcp
        mode: ingress

    volumes:
      # NGINX reverse proxy configuration
      - type: bind
        source: /root/taskapp-build/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true

      # Let's Encrypt HTTP verification files
      - type: bind
        source: /var/www/letsencrypt
        target: /var/www/letsencrypt
        read_only: true

      # Let's Encrypt certificate symlinks
      - type: bind
        source: /etc/letsencrypt/live/ece1779-taskapp
        target: /etc/letsencrypt/live/ece1779-taskapp
        read_only: true

      # Actual certificate and private key files
      - type: bind
        source: /etc/letsencrypt/archive/ece1779-taskapp
        target: /etc/letsencrypt/archive/ece1779-taskapp
        read_only: true

    networks:
      - backend

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  backend:
    external: true
    name: taskapp-db_backend
