
# ECE1779 Collaborative Task Management Platform
# Node.js API deployment configuration
# Maintained by: Ishmam Ahmed

services:
  api:
    # Placeholder: replace with the actual backend image later
    image: ghcr.io/REPLACE_WITH_OWNER/taskapp-api:latest

    networks:
      - backend

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      NODE_ENV: production

    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure

networks:
  backend:
    external: true
    name: taskapp-db_backend
